[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost-guard"
version = "0.1.0"
description = "Track, cap and alert on LLM API costs — a drop-in guard for OpenAI-compatible apps. Stop surprise bills."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "tiny999-web" }]
keywords = ["llm", "openai", "cost", "budget", "observability", "token", "finops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
llm-cost-guard = "llm_cost_guard.cli:main"

[project.urls]
Homepage = "https://github.com/tiny999-web/llm-cost-guard"
Repository = "https://github.com/tiny999-web/llm-cost-guard"

[tool.setuptools.packages.find]
include = ["llm_cost_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]